name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (node:test)
        run: npm test

      - name: Skill + manifest validation
        run: node dist/cli/index.js validate

      - name: Doctor
        run: node dist/cli/index.js doctor
